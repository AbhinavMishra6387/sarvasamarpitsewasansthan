<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800" />
      <stop offset="50%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Circular Outer Frame -->
  <circle cx="250" cy="250" r="230" fill="#FFFFFF" stroke="#F57C00" stroke-width="8" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="#2D2D2D" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Radiance Rays / Lotus petals behind -->
  <g fill="none" stroke="#FFE082" stroke-width="3">
    <circle cx="250" cy="250" r="190" />
  </g>

  <!-- Central Emblem Background -->
  <circle cx="250" cy="235" r="145" fill="url(#gradOrange)" filter="url(#shadow)" />

  <!-- Sacred River Sangam Waves -->
  <path d="M 140 310 Q 195 290 250 310 T 360 310 L 360 330 Q 305 310 250 330 T 140 330 Z" fill="#FFFFFF" opacity="0.3" />
  <path d="M 160 325 Q 205 310 250 325 T 340 325 L 340 340 Q 295 325 250 340 T 160 340 Z" fill="#FFFFFF" opacity="0.4" />

  <!-- Sacred Om Calligraphy -->
  <text x="250" y="275" font-family="'Poppins', 'Arial Unicode MS', sans-serif" font-size="115" font-weight="900" fill="#FFFFFF" text-anchor="middle" filter="url(#shadow)">
    ॐ
  </text>

  <!-- Lotus Base -->
  <path d="M 200 330 C 220 310, 280 310, 300 330 C 270 345, 230 345, 200 330 Z" fill="url(#gradGold)" />

  <!-- Bottom Arch Text: Sarva Samarpit Sewa Sansthan -->
  <path id="textArcTop" d="M 90 250 A 160 160 0 0 1 410 250" fill="none" />
  <path id="textArcBottom" d="M 420 250 A 175 175 0 0 1 80 250" fill="none" />

  <!-- Circular Text -->
  <text font-family="'Poppins', sans-serif" font-size="19" font-weight="800" fill="#2D2D2D" letter-spacing="2">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      PRAYAGRAJ &bull; REG. CHARITABLE TRUST
    </textPath>
  </text>

  <!-- Service Motto Banner -->
  <rect x="100" y="420" width="300" height="42" rx="21" fill="#2D2D2D" />
  <text x="250" y="447" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    SARVA SAMARPIT SEWA SANSTHAN
  </text>
</svg>
